name: Task Manager CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: TEST AND BUILD
  # ==========================================

  test-and-build:
    name: Test and Build Application
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests
      - name: Run tests
        run: npm test

      # Step 5: Build application
      - name: Build application
        run: npm run build

      # Step 6: Build Docker image (validation only)
      - name: Build Docker image
        run: docker build -t task-manager-api:test .


  # ==========================================
  # JOB 2: PUBLISH DOCKER IMAGE TO GHCR
  # ==========================================

  publish-image:
    name: Build and Publish Multi-Platform Image

    # Run only after test-and-build succeeds.
    needs: test-and-build

    # Publish only when code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Enable QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Generate lowercase Docker image name
      - name: Get image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Step 6: Build and push multi-platform Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
  # ==========================================
  # JOB 3: DEPLOY TO KUBERNETES
  # ==========================================

  deploy:
    name: Deploy to Minikube

    # Wait until the Docker image is published.
    needs: publish-image

    # Deploy only on pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Use our Mac's self-hosted runner.
    runs-on: [self-hosted, macOS, ARM64, minikube]

    steps:

      # Step 1: Check Kubernetes connection
      - name: Check Kubernetes connection
        run: |
          kubectl get nodes

      # Step 2: Update Deployment with the new image
      - name: Deploy new Docker image
        run: |
          kubectl set image deployment/task-manager-deployment \
            task-manager=ghcr.io/bq-nikita-58/task-manager-api:${GITHUB_SHA}

      # Step 3: Wait for rollout
      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/task-manager-deployment --timeout=180s

      # Step 4: Verify deployment
      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services            