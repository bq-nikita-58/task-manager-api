
name: Task Manager CI

# Start the workflow on pushes and pull requests
# targeting the main branch.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default permissions: read-only access to the repository.
permissions:
  contents: read

jobs:
  test-and-build:

    # Run this job on a GitHub-hosted Ubuntu machine.
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download the repository code.
      - name: Checkout source code
        uses: actions/checkout@v6

      # Step 2: Install the required Node.js version.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Step 3: Install exact dependency versions.
      - name: Install dependencies
        run: npm ci

      # Step 4: Run automated tests.
      - name: Run tests
        run: npm test

      # Step 5: Validate application build.
      - name: Build application
        run: npm run build

      # Step 6: Validate Docker image build.
      - name: Build Docker image
        run: docker build -t task-manager-api:test .


  publish-image:

    # This job must wait for CI to succeed.
    needs: test-and-build

    # Publish only for pushes to main, not pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # This job needs permission to publish packages.
    permissions:
      contents: read
      packages: write

    steps:

      # Step 1: Get the source code.
      - name: Checkout source code
        uses: actions/checkout@v6

      # Step 2: Configure Docker Buildx.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to GitHub Container Registry.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Create a lowercase image name.
      - name: Set image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      # Step 5: Build and publish the image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
